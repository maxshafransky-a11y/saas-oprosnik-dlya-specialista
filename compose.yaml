services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-health_intake}
      POSTGRES_USER: ${POSTGRES_USER:-health_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health_owner_dev_only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - health_intake_pgdata:/var/lib/postgresql/data
      - ./ops/init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  clamav:
    image: clamav/clamav:1.4.6
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - health_intake_clamav_db:/var/lib/clamav
    restart: unless-stopped

volumes:
  health_intake_pgdata:
  health_intake_clamav_db:
